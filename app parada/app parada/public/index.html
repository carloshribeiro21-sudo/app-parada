<script>
    // ... (mantenha as variáveis globais dashboardTitle, EVENT_DATE, etc. como estão)

    // INTEGRAÇÃO COM BACKEND API - VERSÃO CORRIGIDA
    async function loadDataFromServer() {
        try {
            // Adicionado o parâmetro '?v=' + timestamp para forçar o navegador a baixar a versão nova
            const response = await fetch('/api/data?v=' + new Date().getTime());
            const data = await response.json();
            
            dashboardTitle = data.dashboardTitle || "Troca de Soleira";
            EVENT_DATE = data.EVENT_DATE ? new Date(data.EVENT_DATE) : new Date(2026, 3, 9);
            
            if (data.teamsConfig) {
                teamsConfig = data.teamsConfig;
            } else {
                // Configuração padrão caso o servidor falhe
                teamsConfig = {
                    "Turno 1": { members: "Weverton, Raissa e Thayanne", color: "blue" },
                    "Turno 2": { members: "Valdeir, Edmar e Gabriela", color: "green" },
                    "Turno 3": { members: "José R, Rodrigo e Reginaldo", color: "gray" },
                    "Ormec": { members: "Equipa de Limpeza Técnica", color: "yellow" }
                };
            }

            if (data.activities) {
                activities = data.activities;
            }

            document.getElementById('main-dashboard-title').textContent = dashboardTitle;
            document.title = `Dashboard de Parada - ${dashboardTitle}`;

            loadConfigToUI();
            renderTeamMembers();
            updateTeamFilter();
            render();
            if(isAdminAuthenticated) renderAdminList();
        } catch (error) {
            console.error("Erro ao carregar dados do servidor:", error);
            showToast('Erro ao sincronizar dados. Verifique a conexão.', 'error');
        }
    }

    // ... (mantenha o restante das funções saveDataToServer, render, etc.)
</script>
